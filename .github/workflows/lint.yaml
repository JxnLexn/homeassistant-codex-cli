name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  app:
    name: Home Assistant App
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7.0.1
      - name: App prüfen
        uses: frenck/action-addon-linter@v2.21
        with:
          path: ./codex_cli
